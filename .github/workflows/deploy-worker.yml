name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/confident-cori-fbbeot
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test token permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Testing token..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',{}).get('status','unknown'), d.get('errors',[]))"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
        run: wrangler deploy 2>&1

      - name: Set GEMINI_API_KEY secret
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY

      - name: Output Worker URL
        run: echo "Worker deployed at https://pageturner-proxy.melissaozturk24.workers.dev"
