name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/confident-cori-fbbeot
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 90a31557c4acc8476defb30916b4d6d1
          workingDirectory: proxy
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Output Worker URL
        run: echo "Worker deployed at https://pageturner-proxy.melissaozturk24.workers.dev"
