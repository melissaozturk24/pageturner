name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/confident-cori-fbbeot
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
        run: |
          wrangler deploy --verbose 2>&1

      - name: Set GEMINI_API_KEY secret
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY

      - name: Output Worker URL
        run: echo "Worker deployed at https://pageturner-proxy.melissaozturk24.workers.dev"
