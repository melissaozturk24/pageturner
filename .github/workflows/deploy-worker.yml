name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/confident-cori-fbbeot
    paths:
      - 'proxy/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN GEMINI_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::error::Secret $name is empty or missing"; exit 1; fi
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::Secret $name contains a line break. Re-paste it as a single line."; exit 1
            fi
          done
          status=$(curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or {}).get('status') or d.get('errors'))")
          echo "Cloudflare token status: $status"
          [ "$status" = "active" ] || { echo "::error::Cloudflare token is not active"; exit 1; }

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
        run: wrangler deploy 2>&1

      - name: Set GEMINI_API_KEY secret
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 90a31557c4acc8476defb30916b4d6d1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: echo "$GEMINI_API_KEY" | wrangler secret put GEMINI_API_KEY

      - name: Output Worker URL
        run: echo "Worker deployed at https://pageturner-proxy.melissaozturk24.workers.dev"
